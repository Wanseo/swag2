<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%skylrk-favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="음악의 분위기가 색으로 번지는 공간, moodroom." />
    <link rel="canonical" href="https://wanseo.github.io/swag2/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="moodroom — sound into colour" />
    <meta property="og:description" content="음악의 분위기가 색으로 번지는 공간, moodroom." />
    <meta property="og:url" content="https://wanseo.github.io/swag2/" />
    <title>moodroom — sound into colour</title>
  </head>
  <body>
    <div id="app">
  <canvas id="atmosphere" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
    <header><a class="wordmark" href="./" aria-label="홈"><img src="/src/assets/blue-symbol.webp" alt="파란 심볼" class="brand-symbol" width="372" height="168" decoding="async" /></a></header>
  <main class="experience">

    <section class="stage" aria-label="음악의 분위기를 담는 공간">
      <div class="player-levitation">
      <figure class="player-foreground">
        <img class="player-body" src="/src/assets/blue-player-640.webp" srcset="/src/assets/blue-player-640.webp 640w, /src/assets/blue-player-1162.webp 1162w" sizes="(min-width: 761px) and (pointer: fine) min(511px, 73.9vw, 49.2svh), min(444px, 64.3vw, 42.8svh)" width="1162" height="1354" decoding="async" alt="반투명 하늘색 케이스와 청록색 화면의 빈티지 MP3 플레이어" fetchpriority="high" draggable="false" />
        <div class="album-screen" id="album-screen" hidden>
          <img id="album-art" alt="Justin Bieber — SWAG II 앨범 표지" width="600" height="600" decoding="async" />
          <div class="track-display"><span id="track-title"></span><span id="track-position"></span></div>
        </div>
        <div class="track-menu" id="track-menu" hidden>
          <div class="track-menu-header"><span>SWAG II</span><span id="menu-position">01 / 23</span></div>
          <div id="track-list" role="listbox" aria-label="SWAG II 곡 선택" tabindex="0"></div>
        </div>
        <button class="player-hit menu" id="open-track-menu" aria-label="SWAG II 곡 목록" aria-expanded="false" aria-controls="track-menu"></button>
        <button class="player-hit up" id="menu-up" aria-label="목록에서 이전 곡 선택" disabled></button>
        <button class="player-hit down" id="menu-down" aria-label="목록에서 다음 곡 선택" disabled></button>
        <button class="player-hit replay" id="replay-preview" aria-label="현재 곡 미리듣기 처음부터 다시 듣기"></button>
        <button class="player-hit previous" id="previous-track" aria-label="SWAG II 이전 곡 보기"></button>
        <button class="player-hit toggle" id="toggle-preview" aria-label="SWAG II 미리듣기 재생" aria-pressed="false"></button>
        <button class="player-hit next" id="next-track" aria-label="SWAG II 다음 곡 보기"></button>
      </figure>
      </div>
    </section>
  </main>
        <div class="preview-info" id="preview-info">
          <a id="itunes-link" href="https://music.apple.com/us/album/swag-ii/1837867200?app=itunes" target="_blank" rel="noopener noreferrer" aria-label="iTunes에서 SWAG II 앨범 보기"><img src="/src/assets/itunes-badge.png" alt="Get it on iTunes" width="110" height="40" loading="lazy" /></a>
          <p id="preview-status" role="status" aria-live="polite">Justin Bieber · SWAG II 미리듣기</p>
          <small>Song previews provided courtesy of iTunes.</small>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
