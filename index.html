<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="음악의 분위기가 색으로 번지는 공간, moodroom." />
    <title>moodroom — sound into colour</title>
  </head>
  <body>
    <div id="app">
  <canvas id="atmosphere" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <main class="experience">
    <header><a class="wordmark" href="./" aria-label="홈"><img src="/src/assets/blue-symbol.webp" alt="파란 심볼" class="brand-symbol" width="372" height="168" decoding="async" /></a><button id="motion" class="text-button" aria-pressed="false" aria-label="움직임 멈추기"><span aria-hidden="true">Ⅱ</span></button></header>
    <section class="stage" aria-label="음악의 분위기를 담는 공간">
      <figure class="player-foreground">
        <template id="earphone-template"><img class="player-cable" src="/src/assets/pink-earphones.png" alt="" aria-hidden="true" width="1024" height="1536" draggable="false" /></template>
        <img class="player-body" src="/src/assets/blue-player-640.webp" srcset="/src/assets/blue-player-640.webp 640w, /src/assets/blue-player-1162.webp 1162w" sizes="min(580px, 84vw, 56svh)" width="1162" height="1354" decoding="async" alt="반투명 하늘색 케이스와 청록색 화면의 빈티지 MP3 플레이어" fetchpriority="high" draggable="false" />
      </figure>
    </section>
    <footer><div class="mood-info"><span class="tiny-label"><i></i> COLOUR STUDY / <span id="mood-number">01</span></span><h2 id="mood-title">Daydream</h2><p id="mood-note">몽환적인 오후, 느리게 번지는 색</p></div><div class="palette-control"><span class="tiny-label">CHOOSE YOUR ATMOSPHERE</span><div class="mood-options" role="group" aria-label="분위기 선택"><button class="mood-button" data-mood="daydream" aria-pressed="true" aria-label="Daydream"><span class="swatch" style="background:linear-gradient(135deg, #81b5c0, #e7a4a8, #326f7c)"></span><span>Daydream</span></button><button class="mood-button" data-mood="warmth" aria-pressed="false" aria-label="Warmth"><span class="swatch" style="background:linear-gradient(135deg, #e9b77d, #d88770, #96b3b4)"></span><span>Warmth</span></button><button class="mood-button" data-mood="drift" aria-pressed="false" aria-label="Drift"><span class="swatch" style="background:linear-gradient(135deg, #86a99a, #6ca8be, #194c58)"></span><span>Drift</span></button><button class="mood-button" data-mood="afterglow" aria-pressed="false" aria-label="Afterglow"><span class="swatch" style="background:linear-gradient(135deg, #ac9dc4, #e7a2ab, #676b94)"></span><span>Afterglow</span></button></div></div><div class="connection"><span class="connection-icon">≋</span><span>음악이 색이 되는 순간<small>Spotify 연결 예정 · 지금은 분위기 미리보기</small></span></div></footer>
  </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
