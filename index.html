<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="음악의 분위기가 색으로 번지는 공간, moodroom." />
    <title>moodroom — sound into colour</title>
  </head>
  <body>
    <div id="app">
  <canvas id="atmosphere" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <main class="experience">
    <header><a class="wordmark" href="./" aria-label="홈"><img src="/src/assets/blue-symbol.webp" alt="파란 심볼" class="brand-symbol" width="372" height="168" decoding="async" /></a></header>
    <section class="stage" aria-label="음악의 분위기를 담는 공간">
      <figure class="player-foreground">
        <template id="earphone-template"><img class="player-cable" src="/src/assets/pink-earphones.png" alt="" aria-hidden="true" width="1024" height="1536" draggable="false" /></template>
        <img class="player-body" src="/src/assets/blue-player-640.webp" srcset="/src/assets/blue-player-640.webp 640w, /src/assets/blue-player-1162.webp 1162w" sizes="min(580px, 84vw, 56svh)" width="1162" height="1354" decoding="async" alt="반투명 하늘색 케이스와 청록색 화면의 빈티지 MP3 플레이어" fetchpriority="high" draggable="false" />
        <div class="album-screen" id="album-screen" hidden>
          <img id="album-art" alt="Justin Bieber — SWAG II 앨범 표지" width="600" height="600" decoding="async" />
          <div class="track-display"><span id="track-title"></span><span id="track-position"></span></div>
        </div>
        <button class="player-hit previous" id="previous-track" aria-label="SWAG II 이전 곡 보기"></button>
        <button class="player-hit toggle" id="toggle-preview" aria-label="SWAG II 미리듣기 재생" aria-pressed="false"></button>
        <button class="player-hit next" id="next-track" aria-label="SWAG II 다음 곡 보기"></button>
        <div class="preview-info" id="preview-info" hidden>
          <p id="preview-status" role="status" aria-live="polite"></p>
          <a id="itunes-link" href="https://music.apple.com/us/album/swag-ii/1837867200?app=itunes" target="_blank" rel="noopener noreferrer" aria-label="iTunes에서 SWAG II 앨범 보기"><img src="/src/assets/itunes-badge.png" alt="Get it on iTunes" width="110" height="40" loading="lazy" /></a>
          <small>Song previews provided courtesy of iTunes.</small>
        </div>
      </figure>
    </section>
  </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
